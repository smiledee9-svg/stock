name: SCB Intelligence Auto Pipeline

on:
  schedule:
    # รอบพักเที่ยง: 13:00 น. เวลาไทย (06:00 UTC) ทุกวันจันทร์ - ศุกร์
    - cron: '0 6 * * 1-5'
    # รอบตลาดปิดเย็น: 17:30 น. เวลาไทย (10:30 UTC) ทุกวันจันทร์ - ศุกร์
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # รันแบบแมนนวลได้ตลอดเวลา

permissions:
  contents: write

jobs:
  update-and-predict:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run SCB Automated Pipeline (Fetch & Predict)
        run: |
          python auto_update.py

      - name: 💾 Commit & Push Updated SCB Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scb_candles.json scb_candles.csv ramanujan_results.json ramanujan_data.js
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(auto): update SCB intelligence data [skip ci]"
            git push origin main
          fi
