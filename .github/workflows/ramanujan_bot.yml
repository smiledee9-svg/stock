name: Ramanujan SET Cycle Auto Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # รอบพักเที่ยง: 12:45 น. เวลาไทย (05:45 UTC) ทุกวันจันทร์ - ศุกร์
    - cron: '45 5 * * 1-5'
    # รอบตลาดปิดเย็น: 17:30 น. เวลาไทย (10:30 UTC) ทุกวันจันทร์ - ศุกร์
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # เปิดให้กดปุ่มสั่งรันเองได้จากหน้าเว็บ GitHub ตลอดเวลา

permissions:
  contents: write

jobs:
  update-and-predict:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Required Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r quant-ramanujan/requirements.txt

      - name: 🚀 Run Ramanujan Automated Pipeline (Fetch & Predict)
        run: |
          python quant-ramanujan/auto_update.py

      - name: 💾 Commit & Push Updated Quant Intelligence
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant-ramanujan/scb_candles.json quant-ramanujan/scb_candles.csv quant-ramanujan/ramanujan_results.json quant-ramanujan/ramanujan_data.js
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(auto): update SCB discrete cycles & predictive intelligence [skip ci]"
            git push origin main
          fi
